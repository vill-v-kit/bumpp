[package]
name = "bumpp-core-napi"
version = "5.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "napi-rs Node bindings for bumpp-core (the pure Rust bumpp version engine)"
homepage = "https://github.com/vill-v-kit/bumpp"
repository = "https://github.com/vill-v-kit/bumpp"

[lib]
crate-type = ["cdylib"]

[dependencies]
bumpp-core = { path = "../../crates/bumpp-core" }
napi = { version = "3.12.0", features = ["serde-json", "async"] }
napi-derive = "3.6.1"
serde_json = "1.0.151"

[build-dependencies]
napi-build = "2.4.0"
