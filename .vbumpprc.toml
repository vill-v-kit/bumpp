# 本仓库（vill-v/bump）的项目级配置。changelog types 的中文分组标题是
# 本仓库的定制——内建默认为英文（ADR-0017），中文经此处项目级配置注入，
# 保证本仓库 CHANGELOG 产出与历史归档一致。
# 注：不配置 files——根 Cargo.toml（[workspace.package].version）已在默认
# 清单（链上 manifest basenames 根级并集，ADR-0007），显式 files 会在浅替换
# 语义下顶替默认清单、反把根 package.json 挤出发版面（ADR-0013）；嵌套
# npm/napi 发版包由 -r 整树收集覆盖。
[changelog]
excludeAuthors = []

[changelog.types.feat]
title = "🚀 特性"

[changelog.types.perf]
title = "🔥 性能优化"

[changelog.types.fix]
title = "🩹 修复"

[changelog.types.refactor]
title = "💅 重构"

[changelog.types.examples]
title = "🏀 示例"

[changelog.types.docs]
title = "📖 文档"

[changelog.types.chore]
title = "🏡 框架"

[changelog.types.build]
title = "📦 打包"

[changelog.types.test]
title = "✅ 测试"

[changelog.types.BreakingChange]
title = "🚨 破坏性改动"

[changelog.types.style]
title = "🎨 样式"
