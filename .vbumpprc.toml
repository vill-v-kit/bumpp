#:schema ./npm/bump/vbumpprc.schema.json
# 本仓库（vill-v/bump）的项目级配置。changelog types 的中文分组标题是
# 本仓库的定制——内建默认为英文（ADR-0017），中文经此处项目级配置注入，
# 保证本仓库 CHANGELOG 产出与历史归档一致。
# 注：不配置 files——根 Cargo.toml（[workspace.package].version）已在默认
# 清单（链上 manifest basenames 根级并集，ADR-0007），显式 files 会在浅替换
# 语义下顶替默认清单、反把根 package.json 挤出发版面（ADR-0013）；嵌套
# npm/napi 发版包由 -r 整树收集覆盖。
# 注：首行 #:schema 指令供 Taplo 关联 npm 包内提交的 schema 产物（再生：
# pnpm regen:schema），编辑器据此对键名 / 类型补全与报红；TOML 注释对
# vbumpp 运行期无影响。
[changelog]
excludeAuthors = []
[changelog.types]
feat = { title = "🚀 特性" }
perf = { title = "🔥 性能优化" }
fix = { title = "🩹 修复" }
refactor = { title = "💅 重构" }
examples = { title = "🏀 示例" }
docs = { title = "📖 文档", excludeScopes = ["agent"] }
chore = { title = "🏡 框架", excludeScopes = ["deps", "agent"] }
build = { title = "📦 打包" }
test = { title = "✅ 测试" }
BreakingChange = { title = "🚨 破坏性改动" }
style = { title = "🎨 样式" }
