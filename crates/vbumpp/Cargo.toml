[package]
name = "vbumpp"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Pure Rust vbumpp CLI binary (thin shell over vbumpp-core run_from_argv; zero napi dependencies)"
homepage = "https://github.com/vill-v-kit/bumpp"
repository = "https://github.com/vill-v-kit/bumpp"

[[bin]]
name = "vbumpp"
path = "src/main.rs"

[dependencies]
vbumpp-core.workspace = true
