[package]
name = "bumpp-core"
version = "5.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Pure Rust implementation of the bumpp version engine (upstream antfu/bumpp v11 semantics)"
homepage = "https://github.com/vill-v-kit/bumpp"
repository = "https://github.com/vill-v-kit/bumpp"

[dependencies]
glob = "0.3.3"
shell-words = "1.1.0"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
jsonc-parser = "0.33.1"
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml_edit = "0.23"
url = "2.5"

[dev-dependencies]
tempfile = "3.20.0"
