[package]
name = "bumpp-core"
version.workspace = true
edition = "2021"
license = "MIT"
publish = false
description = "Pure Rust implementation of the bumpp version engine (upstream antfu/bumpp v11 semantics)"
homepage = "https://github.com/vill-v-kit/bumpp"
repository = "https://github.com/vill-v-kit/bumpp"

[dependencies]
aes-gcm = "0.10"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
dirs = "6.0.0"
glob = "0.3.3"
jsonc-parser = { version = "0.33.1", features = ["serde"] }
rand = "0.9"
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
shell-words = "1.1.0"
toml = "0.9"
toml_edit = "0.23"
ureq = { version = "3", features = ["json"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.20.0"
