[package]
name = "bumpp-core"
version = "5.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Pure Rust implementation of the bumpp version engine (upstream antfu/bumpp v11 semantics)"
homepage = "https://gitee.com/vill-v/bump"
repository = "https://gitee.com/vill-v/bump"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.20.0"
