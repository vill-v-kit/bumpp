[package]
name = "bumpp-cli"
version.workspace = true
edition = "2021"
license = "MIT"
publish = false
description = "Pure Rust vbumpp CLI binary (thin shell over bumpp-core run_from_argv; zero napi dependencies)"
homepage = "https://github.com/vill-v-kit/bumpp"
repository = "https://github.com/vill-v-kit/bumpp"

[[bin]]
name = "vbumpp"
path = "src/main.rs"

[dependencies]
bumpp-core.workspace = true
