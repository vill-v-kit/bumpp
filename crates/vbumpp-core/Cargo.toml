[package]
name = "vbumpp-core"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Pure Rust implementation of the bumpp version engine (upstream antfu/bumpp v11 semantics)"
homepage = "https://vill-v-kit.github.io/bumpp/"
repository = "https://github.com/vill-v-kit/bumpp"

[dependencies]
aes-gcm = "0.10"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
dirs = "6.0.0"
glob = "0.3.3"
jsonc-parser = { version = "0.33.1", features = ["serde"] }
rand = "0.9"
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
shell-words = "1.1.0"
toml = "0.9"
toml_edit = "0.23"
# TLS 走 native-tls + vendored openssl：napi cross-toolchain 1.0.3 的 aarch64 gcc
# 过旧（缺 stdatomic.h / 不认 armv8.4-a -march / glibc 头无 AT_HWCAP2），ring 的
# clang 专有汇编与 aws-lc-sys 的现代 C 均无法编译（v6.0.0 tag CI 两连炸实例）；
# openssl 是移植面最广的 C 栈，上古 gcc 也能编。linux 两 legs 经 openssl-src 源码
# 构建，macOS/Windows 走系统 TLS（SecureTransport/Schannel），无额外 C 构建
ureq = { version = "3", default-features = false, features = ["json", "gzip", "native-tls", "vendored"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.20.0"
