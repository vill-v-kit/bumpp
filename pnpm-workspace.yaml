packages:
  - napi/*
  - npm/*
  # 文档网站：精确名而非 glob——website/ 为单包应用目录
  - website

# website（fumadocs/Next.js）传递依赖的安装期脚本审批：esbuild
# （二进制链接）与 sharp（预构建二进制校验）；引入文档站前的依赖面无需构建脚本
allowBuilds:
  esbuild: true
  sharp: true

catalogs:
  dev:
    '@napi-rs/cli': ^3.8.2
    '@types/node': ^26.1.2
    '@vill-v/tsconfig': ^2.0.0
    oxfmt: ^0.61.0
    oxlint: ^1.76.0
    publint: ^0.3.22
    tsdown: ^0.22.14
    turbo: ^2.10.8
    typescript: ^7.0.2
    unplugin-unused: ^0.6.0
    vitest: ^4.1.10

cleanupUnusedCatalogs: true

minimumReleaseAgeExclude:
  - '@esconf/core@2.0.0'
  - '@esconf/preset-mini@2.0.0'
  - '@napi-rs/cli@3.8.2'
