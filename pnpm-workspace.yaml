packages:
  - napi/*
  - npm/*

catalogs:
  dev:
    '@napi-rs/cli': ^3.8.2
    '@types/node': ^26.1.2
    '@vill-v/tsconfig': ^2.0.0
    oxfmt: ^0.61.0
    oxlint: ^1.76.0
    publint: ^0.3.22
    tsdown: ^0.22.14
    turbo: ^2.10.8
    typescript: ^7.0.2
    unplugin-unused: ^0.6.0
    vitest: ^4.1.10

cleanupUnusedCatalogs: true

minimumReleaseAgeExclude:
  - '@esconf/core@2.0.0'
  - '@esconf/preset-mini@2.0.0'
  - '@napi-rs/cli@3.8.2'
