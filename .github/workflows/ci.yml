name: CI

env:
  DEBUG: napi:*

on:
  # 仅在版本 tag（v*）推送时触发：发版构建与全平台测试；全绿后 publish-npm / publish-crates 并行自动上架（ADR-0021）
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node + rust via mise.toml)
        uses: jdx/mise-action@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust cache
        # fmt/clippy/test 共用一个桶（同为 ubuntu 宿主、同 feature 集）
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-test
          workspaces: ". -> target"

      - name: Generate platform packages (create-npm-dirs + LICENSE)
        # 平台包目录不提交进 git（ADR-0029）：先生成，check-licenses 与
        # npm-publish 契约测试才覆盖到 7 个平台包的真实发版态
        run: pnpm create:npm-dirs

      - name: package LICENSE sync
        run: pnpm check:licenses

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      - name: vitest
        run: pnpm test run

      # ADR-0037 防腐腿（COL-104）：重跑两处 schema 产物再生并 diff 提交物——
      # 配置形状变更后忘再生、或手改产物，显式暴露而非静默发生。挂在 test 腿：
      # npm 包副本随包上架直接到用户手里，漂移必须拦在 publish 之前。
      # 二进制须显式构建：cargo test 对无集成测试的 bin crate 只编 deps/ 测试体，
      # 不产出 target/debug/vbumpp（v6.2.0 tag CI 首挂实证），debug 构建即够用
      - name: Build CLI for schema regen
        run: cargo build -p vbumpp

      - name: schema artifact drift check
        run: pnpm check:schema

  # ADR-0036 防腐腿（COL-93）：重跑首页演示采集并 diff 提交产物——CLI 输出
  # 变更后演示腐烂显式暴露，而非静默发生。macOS 宿主：采集脚本依赖 BSD
  # script(1) 的 -q /dev/null 语法。不进 publish 的 needs——演示漂移是网站
  # 内容问题，不拦 npm/crates 上架。
  demo-drift:
    name: demo cast drift check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node + rust via mise.toml)
        uses: jdx/mise-action@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust cache
        # 独立桶：本腿是 macOS 原生 release 构建（target/release/ 直出），
        # 与 build-cli 的 --target 目录布局不同，串桶无收益
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: demo-drift
          workspaces: ". -> target"

      - name: Build release CLI
        # 校验前置构建：CI 环境可复现采集，不依赖本地缓存
        run: cargo build --release -p vbumpp

      - name: Re-capture casts + diff committed artifact
        run: pnpm check:home-demo-cast

  build:
    name: build - ${{ matrix.settings.triple }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            triple: darwin-arm64
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            triple: linux-x64-gnu
          # ADR-0025：zig 链取代 --use-napi-cross（上古 gcc 4.8.5）。napi CLI 的
          # target 校验不收 glibc 后缀，故这条腿直呼 cargo zigbuild pin glibc，
          # 产物按 napi 命名规范落名；index.js/index.d.ts 由其余 napi CLI 腿供给
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            triple: linux-arm64-gnu
            # 存在即走 zigbuild 腿；值是 glibc 下限，同时供 target 后缀与断言取用
            glibc: '2.17'
          # musl 两腿：napi CLI 原生 --cross-compile（内部路由 cargo-zigbuild，
          # 自动 -C target-feature=-crt-static），无需像 arm64-gnu 那样绕过 CLI——
          # musl 是合法 rust triple 无 glibc 后缀，target 校验直接收（ADR-0025）
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            triple: linux-x64-musl
            crossCompile: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            triple: linux-arm64-musl
            crossCompile: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            triple: win32-x64-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            triple: win32-arm64-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node + rust via mise.toml)
        uses: jdx/mise-action@v4

      - name: Add rust target
        run: rustup target add ${{ matrix.settings.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust cache
        # 按 target 分桶：各腿宿主/工具链/target 三元组不同，串桶会互相污染
        # （zigbuild 腿的 target/ 下是交叉产物，更不能与原生腿共享）
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: napi-${{ matrix.settings.triple }}
          workspaces: ". -> target"

      - name: Build (napi CLI)
        if: ${{ !matrix.settings.glibc }}
        run: pnpm --filter @vill-v/bumpp-core exec napi build --platform --release --esm --target ${{ matrix.settings.target }} ${{ matrix.settings.crossCompile && '--cross-compile' }}

      - name: Build (cargo zigbuild, glibc pinned)
        # zig 链交叉：现代 clang + lld（ring/rustls 可编，无 ld.bfd 的 GNU
        # PROPERTY_TYPE 警告），glibc 下限由 target 后缀 pin 死，产物手动落名。
        # zig / cargo-zigbuild 由 mise.toml 声明、mise-action 带 token 安装
        # （不用 mise exec 现取：那条路要打无 token 的 GitHub API，撞限流即红）
        if: ${{ matrix.settings.glibc }}
        run: |
          set -euo pipefail
          cargo zigbuild --release -p bumpp-core-napi \
            --target "${{ matrix.settings.target }}.${{ matrix.settings.glibc }}"
          cp "target/${{ matrix.settings.target }}/release/libbumpp_core_napi.so" \
             "napi/bumpp-core/bumpp-core.${{ matrix.settings.triple }}.node"

      - name: Assert glibc floor <= ${{ matrix.settings.glibc }}
        # COL-63 验收：公开分发平台包，抬 glibc 下限等于静默砍老发行版用户。
        # 判据是「最高被引用版本 ≤ pin 值」——不是全等：产物引用低于 pin 的版本
        # 合法（sort -V 取末位即最高），GLIBC_PRIVATE 无版本号故不参与比较
        if: ${{ matrix.settings.glibc }}
        run: |
          set -euo pipefail
          pin='${{ matrix.settings.glibc }}'
          node_file="napi/bumpp-core/bumpp-core.${{ matrix.settings.triple }}.node"
          refs=$(objdump -T "$node_file" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -uV)
          echo "$refs"
          highest=$(printf '%s\n' "$refs" | tail -1 | sed 's/^GLIBC_//')
          if [ "$(printf '%s\n%s\n' "$pin" "$highest" | sort -V | tail -1)" != "$pin" ]; then
            echo "::error::glibc floor regressed: highest reference GLIBC_${highest} exceeds pinned ${pin}"
            exit 1
          fi

      - name: Upload artifact (napi CLI legs：.node + js + dts)
        if: ${{ !matrix.settings.glibc }}
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.triple }}
          # index.js/index.d.ts 同车捎带：publish-npm 归位 @vill-v/bumpp-core 的
          # main/types 入口用（缺 index.js 则发布包无入口，publint 报 pkg.types
          # 指向不存在文件）；各腿生成物内容一致，merge-multiple 合并无冲突
          path: |
            napi/bumpp-core/bumpp-core.${{ matrix.settings.triple }}.node
            napi/bumpp-core/index.js
            napi/bumpp-core/index.d.ts
          if-no-files-found: error

      - name: Upload artifact (zigbuild leg：.node only)
        # 不经 napi CLI 故无 js/dts 产出，由其余 napi CLI 腿供给（publish-npm 经
        # merge-multiple 合并同名文件，内容一致；前提是至少一条 napi CLI 腿存活
        # ——若将来更多腿转 zigbuild，需另立 js/dts 供给步骤，见 ADR-0025）
        if: ${{ matrix.settings.glibc }}
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.triple }}
          path: napi/bumpp-core/bumpp-core.${{ matrix.settings.triple }}.node
          if-no-files-found: error

  test-bindings:
    name: test bindings - ${{ matrix.settings.triple }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            triple: darwin-arm64
          - host: ubuntu-latest
            triple: linux-x64-gnu
          - host: windows-latest
            triple: win32-x64-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node via mise.toml)
        uses: jdx/mise-action@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.triple }}
          path: napi/bumpp-core

      # 平台包目录不再提交（ADR-0029）：loader 直接走本包根目录的本地 .node
      # fallback，无需把产物拷进平台包目录。smoke 端到端跑生成物 loader：
      # 加载 → 导出面 → cliRun 通路 → 平台变体 bin 注入
      - name: Test bindings
        run: node napi/bumpp-core/smoke.ts

  # COL-63 加分项：交叉产物过 qemu-arm64 容器实跑（加载 + 导出面）。
  # 不进 publish 的 needs——交叉腿实测是额外信心，非上架前置（napi-rs 生态含 oxc 均不测交叉腿）
  test-bindings-arm64-smoke:
    name: smoke - linux-arm64-gnu (qemu)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bindings-linux-arm64-gnu
          path: .artifacts

      - name: Setup qemu (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Load .node in arm64 container
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -v "$PWD/.artifacts:/a:ro" node:22-bookworm-slim node -e '
              const fs = require("fs");
              fs.copyFileSync("/a/bumpp-core.linux-arm64-gnu.node", "/tmp/b.node");
              console.log("arch:", process.arch, "glibc:", process.report.getReport().header.glibcVersionRuntime);
              const m = require("/tmp/b.node");
              const fns = Object.keys(m).filter((k) => typeof m[k] === "function").sort();
              console.log("exports:", fns.join(", "));
              const want = ["BumpVersionTask", "CliRunTask", "bumpVersion", "cliRun"];
              if (want.some((k) => !fns.includes(k))) {
                throw new Error("missing exports, got: " + fns.join(", "));
              }
            '

  # ADR-0021 决策①②：tag 推送即授权，无人工批准门；与 publish-crates 并行。
  # 部分失败后「Re-run failed jobs」是唯一恢复手段——skip-if-published 守卫
  # （COL-51/53）让已上架包自动跳过、未上架包补发，job 可任意次重跑。
  publish-npm:
    name: publish npm
    needs: [test, build, test-bindings]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing（ADR-0021 决策④终态）：id-token 换短期 token 发布，无长效凭证
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node via mise.toml)
        uses: jdx/mise-action@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download artifacts (7 platform .node + index.js + index.d.ts)
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: .artifacts
          merge-multiple: true

      - name: Generate platform packages (create-npm-dirs + LICENSE)
        # 平台包目录由 napi.targets 单一真相源生成，不提交进 git（ADR-0029）：
        # create-npm-dirs 生成 napi/<triple>/（package.json + README），脚本补 LICENSE
        run: pnpm create:npm-dirs

      - name: Inject binaries into platform packages (+ index.js/index.d.ts into core)
        # napi artifacts 把 .node 按名字分发进各平台包目录；它要求 napi.targets
        # 全部 target 的产物齐备（缺一即硬失败），故只能在汇聚全腿产物的本 job 执行
        run: pnpm collect:artifacts

      - name: Assert tag version == workspace version
        # 防手滑推错 tag：tag 去 v 前缀必须等于根 package.json 版本（npm 侧版本唯一维护点）
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag ${GITHUB_REF_NAME} => ${tag}, but root workspace version is ${pkg}"
            exit 1
          fi

      - name: Build user packages (tsdown → dist/)
        run: pnpm -r --filter './npm/**' run build

      - name: Pre-validate (pack 13 packages + publint)
        # 任一失败都在上传动作之前拦下；website 与根 monorepo 为 private 不参与
        run: |
          set -euo pipefail
          pnpm -r pack --filter './napi/**' --filter './npm/**' --pack-destination .artifacts/pack
          for d in napi/*/ npm/*/; do
            pnpm exec publint "$d"
          done
          # core 发布包禁含 .node：napi artifacts 刻意把全架构副本写进包根（上游
          # 兜底设计，无开关），files 字段正确≠产物正确，断在产物上防组合回归。
          # 精确匹配 core 包名——平台包 vill-v-bumpp-core-<triple> 应当含 .node
          core_tgz=$(ls .artifacts/pack/vill-v-bumpp-core-[0-9]*.tgz)
          if tar -tzf "$core_tgz" | grep -q '\.node$'; then
            echo "::error::core tarball must not bundle .node binaries:"
            tar -tzf "$core_tgz" | grep '\.node$'
            exit 1
          fi

      - name: Publish (skip-if-published 守卫过滤后上架)
        # npm-publish.ts：守卫过滤未上架包 → pnpm [--filter]×N publish -r --no-git-checks
        # （查询失败 exit 2 拦停；13 包全已上架则空计划收工；pnpm 拓扑序原生处理）
        # 认证：OIDC trusted publishing（ADR-0021 决策④终态）——pnpm 自动用
        # id-token 换短期 token（无需 ~/.npmrc 与长效 NPM_TOKEN；provenance 随 OIDC 自动附加）
        run: node scripts/npm-publish.ts

  # ADR-0021 决策①③：与 publish-npm 并行、无人工批准门；可任意次重跑收敛
  publish-crates:
    name: publish crates
    needs: [test, build, test-bindings]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing（ADR-0021 决策④终态）：crates-io-auth-action 换短期 token
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node + rust via mise.toml)
        uses: jdx/mise-action@v4

      - name: Assert tag version == workspace version
        # 与 publish-npm 对称的防手滑：tag 去 v 前缀必须等于根 Cargo.toml 工作区版本
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$tag" != "$pkg" ]; then
            echo "tag ${GITHUB_REF_NAME} => ${tag}, but Cargo workspace version is ${pkg}"
            exit 1
          fi

      - name: Authenticate with crates.io (OIDC trusted publishing)
        # ADR-0021 决策④终态：GitHub OIDC token 换 crates.io 短期 token，无需长效 CARGO_REGISTRY_TOKEN
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crates (守卫 → dry-run 前置 → core→cli 顺序上架)
        # crates-publish.ts：vbumpp-core → vbumpp 硬序逐一过守卫；GO 的先
        # cargo publish --dry-run 再真实上架（dry-run 失败在上传前拦停）；
        # SKIP 跳过（部分失败重跑自动收敛）；查询失败 exit 2 零 cargo 调用
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: node scripts/crates-publish.ts

  # 7 target 预编译 CLI 产物追加到 bump 流程已建的 GitHub Release（cargo-binstall 免编译渠道）
  build-cli:
    name: build-cli - ${{ matrix.settings.target }}
    needs: [publish-crates]
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # 交叉三腿走 zig 链（mise 装 zig + cargo-zigbuild）
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig: true
            glibc: '2.17'
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.settings.host }}
    permissions:
      # gh release upload 追加 assets 到既有 Release
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node + rust via mise.toml)
        uses: jdx/mise-action@v4

      - name: Add rust target
        run: rustup target add ${{ matrix.settings.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-${{ matrix.settings.target }}
          workspaces: ". -> target"

      - name: Build (cargo, native)
        if: ${{ !matrix.settings.zig }}
        run: cargo build --release -p vbumpp --target ${{ matrix.settings.target }}

      - name: Build (cargo zigbuild)
        # glibc 存在即拼后缀（aarch64-unknown-linux-gnu.2.17）；musl 两腿无后缀
        if: ${{ matrix.settings.zig }}
        run: |
          set -euo pipefail
          cargo zigbuild --release -p vbumpp \
            --target "${{ matrix.settings.target }}${{ matrix.settings.glibc && format('.{0}', matrix.settings.glibc) }}"

      - name: Assert glibc floor <= ${{ matrix.settings.glibc }}
        if: ${{ matrix.settings.zig && matrix.settings.glibc }}
        run: |
          set -euo pipefail
          pin='${{ matrix.settings.glibc }}'
          bin="target/${{ matrix.settings.target }}/release/vbumpp"
          refs=$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -uV)
          echo "$refs"
          highest=$(printf '%s\n' "$refs" | tail -1 | sed 's/^GLIBC_//')
          if [ "$(printf '%s\n%s\n' "$pin" "$highest" | sort -V | tail -1)" != "$pin" ]; then
            echo "::error::glibc floor regressed: highest reference GLIBC_${highest} exceeds pinned ${pin}"
            exit 1
          fi

      - name: Package archive + checksum (binstall default template)
        # 产物 vbumpp-{target}.tar.gz + .sha256；归档顶层目录 vbumpp-{target}/ 放二进制
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.settings.target }}'
          ext=''
          case "$target" in *-windows-*) ext='.exe' ;; esac
          bin="target/${target}/release/vbumpp${ext}"
          test -f "$bin"
          dir="vbumpp-${target}"
          mkdir -p "$dir"
          cp "$bin" "${dir}/vbumpp${ext}"
          tar -czf "${dir}.tar.gz" "$dir"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
          else
            shasum -a 256 "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
          fi

      - name: Upload to GitHub Release (--clobber)
        # 仅追加 assets（Release 由 bump 末段创建）；--clobber 保证重跑幂等收敛
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir="vbumpp-${{ matrix.settings.target }}"
          gh release upload "$GITHUB_REF_NAME" \
            "${dir}.tar.gz" "${dir}.tar.gz.sha256" --clobber
