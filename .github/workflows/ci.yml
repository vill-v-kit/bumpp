name: CI

env:
  DEBUG: napi:*

on:
  # 仅在版本 tag（v*）推送时触发：发版构建与全平台测试；全绿后 publish-npm / publish-crates 并行自动上架（ADR-0021）
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node + rust via mise.toml)
        uses: jdx/mise-action@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust cache
        # fmt/clippy/test 共用一个桶（同为 ubuntu 宿主、同 feature 集）
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-test
          workspaces: ". -> target"

      - name: package LICENSE sync
        run: pnpm check:licenses

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      - name: vitest
        run: pnpm test run

  build:
    name: build - ${{ matrix.settings.triple }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            triple: darwin-arm64
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            triple: linux-x64-gnu
          # ADR-0025：zig 链取代 --use-napi-cross（上古 gcc 4.8.5）。napi CLI 的
          # target 校验不收 glibc 后缀，故这条腿直呼 cargo zigbuild pin glibc，
          # 产物按 napi 命名规范落名；index.d.ts 由其余四腿供给
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            triple: linux-arm64-gnu
            # 存在即走 zigbuild 腿；值是 glibc 下限，同时供 target 后缀与断言取用
            glibc: '2.17'
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            triple: win32-x64-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            triple: win32-arm64-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node + rust via mise.toml)
        uses: jdx/mise-action@v4

      - name: Add rust target
        run: rustup target add ${{ matrix.settings.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust cache
        # 按 target 分桶：各腿宿主/工具链/target 三元组不同，串桶会互相污染
        # （zigbuild 腿的 target/ 下是交叉产物，更不能与原生腿共享）
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: napi-${{ matrix.settings.triple }}
          workspaces: ". -> target"

      - name: Build (napi CLI)
        if: ${{ !matrix.settings.glibc }}
        run: pnpm --filter @vill-v/bumpp-core exec napi build --platform --release --no-js --target ${{ matrix.settings.target }}

      - name: Build (cargo zigbuild, glibc pinned)
        # zig 链交叉：现代 clang + lld（ring/rustls 可编，无 ld.bfd 的 GNU
        # PROPERTY_TYPE 警告），glibc 下限由 target 后缀 pin 死，产物手动落名。
        # zig / cargo-zigbuild 由 mise.toml 声明、mise-action 带 token 安装
        # （不用 mise exec 现取：那条路要打无 token 的 GitHub API，撞限流即红）
        if: ${{ matrix.settings.glibc }}
        run: |
          set -euo pipefail
          cargo zigbuild --release -p bumpp-core-napi \
            --target "${{ matrix.settings.target }}.${{ matrix.settings.glibc }}"
          cp "target/${{ matrix.settings.target }}/release/libbumpp_core_napi.so" \
             "napi/bumpp-core/bumpp-core.${{ matrix.settings.triple }}.node"

      - name: Assert glibc floor <= ${{ matrix.settings.glibc }}
        # COL-63 验收：公开分发平台包，抬 glibc 下限等于静默砍老发行版用户。
        # 判据是「最高被引用版本 ≤ pin 值」——不是全等：产物引用低于 pin 的版本
        # 合法（sort -V 取末位即最高），GLIBC_PRIVATE 无版本号故不参与比较
        if: ${{ matrix.settings.glibc }}
        run: |
          set -euo pipefail
          pin='${{ matrix.settings.glibc }}'
          node_file="napi/bumpp-core/bumpp-core.${{ matrix.settings.triple }}.node"
          refs=$(objdump -T "$node_file" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -uV)
          echo "$refs"
          highest=$(printf '%s\n' "$refs" | tail -1 | sed 's/^GLIBC_//')
          if [ "$(printf '%s\n%s\n' "$pin" "$highest" | sort -V | tail -1)" != "$pin" ]; then
            echo "::error::glibc floor regressed: highest reference GLIBC_${highest} exceeds pinned ${pin}"
            exit 1
          fi

      - name: Upload artifact (napi CLI legs：.node + dts)
        if: ${{ !matrix.settings.glibc }}
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.triple }}
          # index.d.ts 同车捎带：publish-npm 注入 @vill-v/bumpp-core 的 types 入口用
          # （napi build --no-js 仍产出 dts；缺它 publint 报 pkg.types 指向不存在文件）
          path: |
            napi/bumpp-core/bumpp-core.${{ matrix.settings.triple }}.node
            napi/bumpp-core/index.d.ts
          if-no-files-found: error

      - name: Upload artifact (zigbuild leg：.node only)
        # 不经 napi CLI 故无 dts 产出，其余四腿供给（publish-npm 经
        # merge-multiple 合并同名 dts，内容一致；前提是至少一条 napi CLI 腿存活
        # ——若将来更多腿转 zigbuild，需另立 dts 供给步骤，见 ADR-0025）
        if: ${{ matrix.settings.glibc }}
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.triple }}
          path: napi/bumpp-core/bumpp-core.${{ matrix.settings.triple }}.node
          if-no-files-found: error

  test-bindings:
    name: test bindings - ${{ matrix.settings.triple }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            triple: darwin-arm64
          - host: ubuntu-latest
            triple: linux-x64-gnu
          - host: windows-latest
            triple: win32-x64-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node via mise.toml)
        uses: jdx/mise-action@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.triple }}
          path: napi/bumpp-core

      - name: Copy artifact into platform package
        run: cp napi/bumpp-core/bumpp-core.${{ matrix.settings.triple }}.node napi/bumpp-core-${{ matrix.settings.triple }}/

      - name: Test bindings
        run: pnpm exec vitest run napi/bumpp-core

  # COL-63 加分项：交叉产物过 qemu-arm64 容器实跑（加载 + 导出面）。
  # 不进 publish 的 needs——交叉腿实测是额外信心，非上架前置（napi-rs 生态含 oxc 均不测交叉腿）
  test-bindings-arm64-smoke:
    name: smoke - linux-arm64-gnu (qemu)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bindings-linux-arm64-gnu
          path: .artifacts

      - name: Setup qemu (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Load .node in arm64 container
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -v "$PWD/.artifacts:/a:ro" node:22-bookworm-slim node -e '
              const fs = require("fs");
              fs.copyFileSync("/a/bumpp-core.linux-arm64-gnu.node", "/tmp/b.node");
              console.log("arch:", process.arch, "glibc:", process.report.getReport().header.glibcVersionRuntime);
              const m = require("/tmp/b.node");
              const fns = Object.keys(m).filter((k) => typeof m[k] === "function").sort();
              console.log("exports:", fns.join(", "));
              const want = ["BumpVersionTask", "CliRunTask", "bumpVersion", "cliRun"];
              if (want.some((k) => !fns.includes(k))) {
                throw new Error("missing exports, got: " + fns.join(", "));
              }
            '

  # ADR-0021 决策①②：tag 推送即授权，无人工批准门；与 publish-crates 并行。
  # 部分失败后「Re-run failed jobs」是唯一恢复手段——skip-if-published 守卫
  # （COL-51/53）让已上架包自动跳过、未上架包补发，job 可任意次重跑。
  publish-npm:
    name: publish npm
    needs: [test, build, test-bindings]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing（ADR-0021 决策④终态）：id-token 换短期 token 发布，无长效凭证
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node via mise.toml)
        uses: jdx/mise-action@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download artifacts (5 platform .node + index.d.ts)
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: .artifacts
          merge-multiple: true

      - name: Inject binaries into platform packages (+ index.d.ts into core)
        # 注入逻辑与 test-bindings job 同款：每个平台三元组一对「artifact → 平台包目录」
        run: |
          set -euo pipefail
          for triple in darwin-arm64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc win32-arm64-msvc; do
            cp ".artifacts/bumpp-core.$triple.node" "napi/bumpp-core-$triple/"
          done
          cp .artifacts/index.d.ts napi/bumpp-core/index.d.ts

      - name: Assert tag version == workspace version
        # 防手滑推错 tag：tag 去 v 前缀必须等于根 package.json 版本（npm 侧版本唯一维护点）
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag ${GITHUB_REF_NAME} => ${tag}, but root workspace version is ${pkg}"
            exit 1
          fi

      - name: Build user packages (tsdown → dist/)
        run: pnpm -r --filter './npm/**' run build

      - name: Pre-validate (pack 11 packages + publint)
        # 任一失败都在上传动作之前拦下；website 与根 monorepo 为 private 不参与
        run: |
          set -euo pipefail
          pnpm -r pack --filter './napi/**' --filter './npm/**' --pack-destination .artifacts/pack
          for d in napi/*/ npm/*/; do
            pnpm exec publint "$d"
          done

      - name: Publish (skip-if-published 守卫过滤后上架)
        # npm-publish.mjs：守卫过滤未上架包 → pnpm [--filter]×N publish -r --no-git-checks
        # （查询失败 exit 2 拦停；11 包全已上架则空计划收工；pnpm 拓扑序原生处理）
        # 认证：OIDC trusted publishing（ADR-0021 决策④终态）——pnpm 自动用
        # id-token 换短期 token（无需 ~/.npmrc 与长效 NPM_TOKEN；provenance 随 OIDC 自动附加）
        run: node scripts/npm-publish.mjs

  # ADR-0021 决策①③：与 publish-npm 并行、无人工批准门；可任意次重跑收敛
  publish-crates:
    name: publish crates
    needs: [test, build, test-bindings]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing（ADR-0021 决策④终态）：crates-io-auth-action 换短期 token
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node + rust via mise.toml)
        uses: jdx/mise-action@v4

      - name: Assert tag version == workspace version
        # 与 publish-npm 对称的防手滑：tag 去 v 前缀必须等于根 Cargo.toml 工作区版本
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$tag" != "$pkg" ]; then
            echo "tag ${GITHUB_REF_NAME} => ${tag}, but Cargo workspace version is ${pkg}"
            exit 1
          fi

      - name: Authenticate with crates.io (OIDC trusted publishing)
        # ADR-0021 决策④终态：GitHub OIDC token 换 crates.io 短期 token，无需长效 CARGO_REGISTRY_TOKEN
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crates (守卫 → dry-run 前置 → core→cli 顺序上架)
        # crates-publish.mjs：vbumpp-core → vbumpp 硬序逐一过守卫；GO 的先
        # cargo publish --dry-run 再真实上架（dry-run 失败在上传前拦停）；
        # SKIP 跳过（部分失败重跑自动收敛）；查询失败 exit 2 零 cargo 调用
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: node scripts/crates-publish.mjs

  # ADR-0025：7 target 预编译 CLI 追加到 bump 流程已建的 GitHub Release，接通
  # cargo-binstall 免编译渠道。产物命名/归档结构是 binstall 默认探测模板的隐式
  # 契约——vbumpp-{target}.tar.gz、归档顶层目录 vbumpp-{target}/、tag v{version}
  # 直接命中，故 crates/vbumpp 零 [package.metadata.binstall]；偏差会令渠道
  # 静默退化为源码编译且无人报错。每产物附 .sha256（binstall 不消费，供用户
  # 手动校验）。失败不影响已上架的 npm/crates；「Re-run failed jobs」靠
  # --clobber 幂等收敛（恢复模型与 ADR-0021 一致）
  build-cli:
    name: build-cli - ${{ matrix.settings.target }}
    needs: [publish-crates]
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # 交叉三腿统一走 zig 链（mise 装 zig + cargo-zigbuild，同 napi 腿注释）：
          # 现代 clang + lld 可编 ring/rustls，绕开上古 gcc 4.8.5
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            # ADR-0025：arm64-gnu 必须 pin glibc 2.17——裸 target 把下限抬至
            # 现代 glibc，等于静默砍老发行版用户
            zig: true
            glibc: '2.17'
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.settings.host }}
    permissions:
      # gh release upload 追加 assets 到既有 Release
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node + rust via mise.toml)
        uses: jdx/mise-action@v4

      - name: Add rust target
        run: rustup target add ${{ matrix.settings.target }}

      - name: Rust cache
        # 与 napi build 同理按 target 分桶：交叉腿的 target/ 是交叉产物，串桶互污染
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-${{ matrix.settings.target }}
          workspaces: ". -> target"

      - name: Build (cargo, native)
        if: ${{ !matrix.settings.zig }}
        run: cargo build --release -p vbumpp --target ${{ matrix.settings.target }}

      - name: Build (cargo zigbuild)
        # glibc 存在即拼后缀（aarch64-unknown-linux-gnu.2.17）；musl 两腿无后缀。
        # CLI 是纯静态二进制，无 napi cdylib 的 -C target-feature=-crt-static 顾虑
        if: ${{ matrix.settings.zig }}
        run: |
          set -euo pipefail
          cargo zigbuild --release -p vbumpp \
            --target "${{ matrix.settings.target }}${{ matrix.settings.glibc && format('.{0}', matrix.settings.glibc) }}"

      - name: Assert glibc floor <= ${{ matrix.settings.glibc }}
        # 与 napi zigbuild 腿同款判据：产物最高被引用 GLIBC 版本 ≤ pin 值
        if: ${{ matrix.settings.zig && matrix.settings.glibc }}
        run: |
          set -euo pipefail
          pin='${{ matrix.settings.glibc }}'
          bin="target/${{ matrix.settings.target }}/release/vbumpp"
          refs=$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -uV)
          echo "$refs"
          highest=$(printf '%s\n' "$refs" | tail -1 | sed 's/^GLIBC_//')
          if [ "$(printf '%s\n%s\n' "$pin" "$highest" | sort -V | tail -1)" != "$pin" ]; then
            echo "::error::glibc floor regressed: highest reference GLIBC_${highest} exceeds pinned ${pin}"
            exit 1
          fi

      - name: Package archive + checksum (binstall default template)
        # 归档顶层目录 vbumpp-{target}/ 内含 vbumpp{,.exe}——命中 bin-dir 候选
        # `{ name }-{ target }/{ bin }{ binary-ext }`；sha256 输出统一为标准
        # sha256sum 格式（hash + 两空格 + 文件名）：ubuntu/Git Bash 有 sha256sum，
        # macOS 无 sha256sum 故回退内建 shasum（两命令输出格式一致）。
        # 打包步骤三平台统一走 bash（Git Bash 自带 bsdtar 处理 .tar.gz）
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.settings.target }}'
          ext=''
          case "$target" in *-windows-*) ext='.exe' ;; esac
          bin="target/${target}/release/vbumpp${ext}"
          test -f "$bin"
          dir="vbumpp-${target}"
          mkdir -p "$dir"
          cp "$bin" "${dir}/vbumpp${ext}"
          tar -czf "${dir}.tar.gz" "$dir"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
          else
            shasum -a 256 "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
          fi

      - name: Upload to GitHub Release (--clobber)
        # 仅追加 assets：Release 本体由 bump 末段 create_release 建好（crates/vbumpp-core
        # 的 release 模块）；不存在即 gh 非零退出硬失败，重跑靠 --clobber 覆盖同名
        # 资产收敛。产物/校验和缺失在本步之前已因 set -e 拦停，流水线红
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir="vbumpp-${{ matrix.settings.target }}"
          gh release upload "$GITHUB_REF_NAME" \
            "${dir}.tar.gz" "${dir}.tar.gz.sha256" --clobber
