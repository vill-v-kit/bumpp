name: Docs

on:
  # 文档站部署：版本 tag（v*）推送时随发版发布，或手动触发
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # 站点线上 base URL（含 basePath 子路径），两道冒烟验证共用
  SITE_URL: https://vill-v-kit.github.io/bumpp

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node via mise.toml)
        uses: jdx/mise-action@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm --filter website build

      # 部署前的产物断言：basePath 丢失类回归在此直接拦截
      - name: Smoke check artifacts
        run: node scripts/docs-smoke.ts assert-artifacts website/out "$SITE_URL"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

  deploy:
    name: deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 冒烟脚本在仓库里，deploy job 也需要 checkout
      - uses: actions/checkout@v7

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # 部署后的线上确认：Pages 传播有延迟，脚本内置轮询
      - name: Smoke check live site
        run: node scripts/docs-smoke.ts check-live "$SITE_URL"
