[workspace]
resolver = "2"
members = ["crates/*", "napi/*", "npm/*"]
# 纯 JS / 平台二进制的包没有 Cargo.toml，会被 npm/* 与 napi/* glob 匹配到而报错，必须显式排除
exclude = [
  "napi/bumpp-core-darwin-arm64",
  "napi/bumpp-core-linux-arm64-gnu",
  "napi/bumpp-core-linux-x64-gnu",
  "napi/bumpp-core-win32-arm64-msvc",
  "napi/bumpp-core-win32-x64-msvc",
  "npm/bump",
  "npm/gitcode",
  "npm/gitee",
  "npm/github",
  "npm/gitlab",
]

[profile.release]
lto = true
# strip 暂不恢复：符号表对未发布期的崩溃诊断有用，且 rustc 内置 strip（llvm-objcopy）
# 在 Mach-O 上另有串池错位 bug（llvm-project#203678，修复随 rustc 1.98 落地
# rust-lang/rust#158410）；当前 Xcode 27 链接器错位由 .cargo/config.toml 的
# SDK 版本声明规避，与 strip 与否正交。rustc ≥ 1.98 后重新评估恢复 strip。
# strip = "symbols"
