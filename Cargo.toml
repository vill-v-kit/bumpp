[workspace]
resolver = "2"
members = ["crates/*", "npm/*"]
# 纯 JS / 平台二进制的 npm 包没有 Cargo.toml，会被 npm/* glob 匹配到而报错，必须显式排除
exclude = [
  "npm/bump",
  "npm/bumpp-core-darwin-arm64",
  "npm/bumpp-core-linux-arm64-gnu",
  "npm/bumpp-core-linux-x64-gnu",
  "npm/bumpp-core-win32-arm64-msvc",
  "npm/bumpp-core-win32-x64-msvc",
  "npm/gitcode",
  "npm/gitee",
  "npm/github",
  "npm/gitlab",
]

[profile.release]
lto = true
strip = "symbols"
