[workspace]
resolver = "2"
members = ["crates/*", "napi/*", "npm/*"]
# 纯 JS / 平台二进制的包没有 Cargo.toml，会被 npm/* 与 napi/* glob 匹配到而报错，必须显式排除。
# napi/<triple> 平台包目录由 napi create-npm-dirs 生成，gitignore 不跟踪，
# 只在生成后存在于磁盘，同样命中 napi/* glob，必须排除。
exclude = [
  "napi/darwin-arm64",
  "napi/linux-arm64-gnu",
  "napi/linux-arm64-musl",
  "napi/linux-x64-gnu",
  "napi/linux-x64-musl",
  "napi/win32-arm64-msvc",
  "napi/win32-x64-msvc",
  "npm/bump",
  "npm/gitcode",
  "npm/gitee",
  "npm/github",
  "npm/gitlab",
]

[workspace.package]
# 版本字面量全仓唯一维护点；成员一律 version.workspace = true 继承
# （vbumpp 发版即更新此字段，见 .vbumpprc.json 的 files）
version = "6.3.0"

[workspace.dependencies]
# 成员间引用一律走 workspace 继承，成员清单内不再写 path
# 宽松 version 供 cargo publish 改写成 registry 依赖：下界兼容现版 5.1（^6 在 5.x 时代不可解析），
# 上界卡 major；crates.io 上 vbumpp-core 只会有锁步发版的 ≥6.0.0，解析必落同代
vbumpp-core = { path = "crates/vbumpp-core", version = ">=5.1, <7" }

[profile.release]
lto = true
# strip 暂不恢复：符号表对未发布期的崩溃诊断有用，且 rustc 内置 strip（llvm-objcopy）
# 在 Mach-O 上另有串池错位 bug（llvm-project#203678，修复随 rustc 1.98 落地
# rust-lang/rust#158410）；当前 Xcode 27 链接器错位由 .cargo/config.toml 的
# SDK 版本声明规避，与 strip 与否正交。rustc ≥ 1.98 后重新评估恢复 strip。
# strip = "symbols"
