[package]
name = "bumpp-core-napi"
version.workspace = true
edition = "2021"
license = "MIT"
publish = false
description = "napi-rs Node bindings for vbumpp-core (the pure Rust bumpp version engine)"
homepage = "https://github.com/vill-v-kit/bumpp"
repository = "https://github.com/vill-v-kit/bumpp"

[lib]
crate-type = ["cdylib"]

[dependencies]
vbumpp-core.workspace = true
napi = { version = "3.12.0", features = ["serde-json", "async"] }
napi-derive = "3.6.1"
serde_json = "1.0.151"

[build-dependencies]
napi-build = "2.4.0"
